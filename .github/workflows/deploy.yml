name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build with Gradle
        run: chmod +x ./gradlew && ./gradlew bootjar

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*-SNAPSHOT.jar"
          target: "/home/ubuntu/dev/scheduly"
          strip_components: 2          # build/libs/ 경로 제거하고 JAR만 올림
          overwrite: true

      - name: Restart Spring Boot app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/dev/scheduly

            echo "[deploy] stop old app"
            if [ -f app.pid ]; then
              PID=$(cat app.pid)
              if ps -p "$PID" > /dev/null 2>&1; then
                kill "$PID" || true
                sleep 5
              fi
              rm app.pid
            fi

            echo "[deploy] start new app"

            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DISCORD_TOKEN='${{ secrets.DISCORD_TOKEN }}'
            export KAKAO_ADMIN_KEY='${{ secrets.KAKAO_ADMIN_KEY }}'
            export KAKAO_BOT_ID='${{ secrets.KAKAO_BOT_ID }}'
            export KAKAO_REST_API_KEY='${{ secrets.KAKAO_REST_API_KEY }}'

            nohup java -jar workingdead-0.0.1-SNAPSHOT.jar > app.log 2>&1 &

            echo $! > app.pid

            sleep 5
            if ps -p "$(cat app.pid)" > /dev/null 2>&1; then
              echo "[deploy] Application started successfully"
            else
              echo "[deploy] Application failed to start"
              tail -n 80 app.log || true
              exit 1
            fi